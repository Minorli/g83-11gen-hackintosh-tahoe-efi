name: EFI release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          [[ "$V" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 1
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次版本: $V"

      - name: Check tag
        id: tag
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "tag ${{ steps.ver.outputs.version }} 已存在，本次跳过发布"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package EFI
        if: steps.tag.outputs.exists == 'false'
        run: |
          V=${{ steps.ver.outputs.version }}
          zip -qr "EFI-$V.zip" EFI
          sha256sum "EFI-$V.zip" > "EFI-$V.zip.sha256"
          cat "EFI-$V.zip.sha256"

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.ver.outputs.version }}
          {
            echo "Dynabook G83 / i7-1165G7 开发预发布，版本 $V。"
            echo
            echo "- 变更详情见自上一 tag 以来的提交记录"
            echo "- 使用方法见 [README](https://github.com/${GITHUB_REPOSITORY}#readme)（三码需自行生成）"
            echo "- 组件来源及版本边界见 [Provenance](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/Provenance.md)"
            echo "- 图形内存、闪屏与队列稳定性仍在修复，详见维护路线。"
            echo
            echo "## 三码提醒（重要）"
            echo
            echo "- **新安装**：包内 `config.plist` 三码为空，需用 [GenSMBIOS](https://github.com/corpnewt/GenSMBIOS) 选择 \`MacBookPro16,2\` 自行生成（详见 README 使用说明第 3 条）"
            echo "- **升级覆盖**：请勿直接用包内的空三码 `config.plist` 覆盖你已生成过的三码！保留你自己机器的 \`SystemSerialNumber / MLB / SystemUUID / ROM\`"
          } > notes.md
          gh release create "$V" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$V" \
            --notes-file notes.md \
            "EFI-$V.zip" "EFI-$V.zip.sha256"
